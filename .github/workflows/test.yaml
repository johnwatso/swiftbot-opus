name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test.yaml"
      - ".gitmodules"
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"
  pull_request:
    paths:
      - ".github/workflows/test.yaml"
      - ".gitmodules"
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"

jobs:
  test:
    name: Test
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test
        run: swift test

      - name: Address sanitizer
        run: swift test --sanitize address

      - name: Generate release build
        run: swift build -c release

      - name: Benchmark Apple-silicon voice encode
        run: swift run -c release opus-benchmark --frames 250
